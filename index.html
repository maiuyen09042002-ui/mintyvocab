<meta charset="UTF-8">

<title>MintyVocab – Học từ vựng theo chủ đề</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ✏️ ĐỔI MÀU: sửa các mã màu ngay dưới đây (--pri = xanh ngọc chính, --pink = hồng nhấn, --grad = dải màu nút/tab) */
:root{
  --bg:#f3f9ff;--card:#fff;--soft:#e2f5ff;--line:#cfe3ff;--pri:#00a896;--pri-ink:#fff;
  --ink:#1d2a4a;--mut:#62708f;--pink:#ff5d8f;--pink-soft:#ffe0ea;--sun:#ffe46b;--sun-ink:#6b4200;
  --ok:#12b886;--bad:#f03e6b;
  --grad:linear-gradient(135deg,#00c9a7,#4c6ef5);--grad2:linear-gradient(135deg,#ff6fa5,#ff9a4d);
  --bgimg:radial-gradient(circle at 8% 0,#ffdcec 0,transparent 32%),radial-gradient(circle at 96% 8%,#cffff0 0,transparent 34%),radial-gradient(circle at 50% 100%,#fff0b3 0,transparent 40%);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a33;--card:#1d2547;--soft:#27316a;--line:#38458a;--pri:#2ee6c8;--pri-ink:#06221d;
  --ink:#eef1ff;--mut:#a9b3e0;--pink-soft:#4a2540;--sun:#4a3d12;--sun-ink:#ffe28a;--bad:#ff8fb0;--ok:#2ee6c8;
  --grad:linear-gradient(135deg,#2ee6c8,#8fb0ff);--bgimg:none}}
:root[data-theme="dark"]{--bg:#141a33;--card:#1d2547;--soft:#27316a;--line:#38458a;--pri:#2ee6c8;--pri-ink:#06221d;--ink:#eef1ff;--mut:#a9b3e0;--pink-soft:#4a2540;--sun:#4a3d12;--sun-ink:#ffe28a;--bad:#ff8fb0;--ok:#2ee6c8;--grad:linear-gradient(135deg,#2ee6c8,#8fb0ff);--bgimg:none}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
header{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:12px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.logo{font-family:'Fredoka',sans-serif;font-size:24px;font-weight:600;color:var(--pri)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:7px 15px;border-radius:99px;background:var(--bg);font-weight:800;font-size:14px;border:2px solid transparent;transition:.15s}
.pill:hover{background:var(--soft)}
.pill.on{background:var(--pri);color:var(--pri-ink)}
.stat{background:var(--sun);color:var(--sun-ink);padding:6px 14px;border-radius:99px;font-weight:800;font-size:13px}
.tabs{display:flex;gap:8px;margin:14px 0}
.tab{flex:1;padding:11px;border-radius:16px;background:var(--card);border:2px solid var(--line);font-weight:800}
.tab.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.grid{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
.list{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;text-align:left;border:2px solid transparent}
.item:hover{background:var(--bg)}
.item.on{background:var(--soft);border-color:var(--line)}
.item .em{font-size:24px}
.item b{display:block;font-size:15px}
.dots{display:flex;gap:3px;margin-top:2px}
.dots i{width:14px;height:5px;border-radius:9px;background:var(--line)}
.dots i.f{background:var(--pri)}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 10px 26px rgba(15,157,134,.08)}
.top{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center}
.pic{aspect-ratio:1;border-radius:32px;background:radial-gradient(circle at 30% 25%,var(--card),var(--soft) 70%);border:3px dashed var(--line);display:grid;place-items:center;font-size:84px;position:relative}
.pic::after{content:"✨";position:absolute;top:8px;right:12px;font-size:20px}
.word{font-family:'Fredoka',sans-serif;font-size:38px;font-weight:600;color:var(--pri);line-height:1.15}
.ipa{color:var(--mut);font-weight:700}
.pos{display:inline-block;background:var(--pink-soft);color:var(--bad);border-radius:99px;padding:1px 10px;font-size:12px;font-weight:800;margin-left:6px}
.vi{font-size:20px;font-weight:800;margin:6px 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--soft);padding:8px 14px;border-radius:99px;font-weight:800;font-size:14px;transition:.15s}
.btn:hover{background:var(--pri);color:var(--pri-ink)}
.btn.solid{background:var(--pri);color:var(--pri-ink)}
h3{font-family:'Fredoka',sans-serif;font-size:17px;font-weight:500;margin:20px 0 8px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.col{background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:9px 12px;text-align:left}
.col:hover{border-color:var(--pri)}
.col b{display:block}.col small{color:var(--mut);font-weight:700}
.chip{background:var(--sun);color:var(--sun-ink);padding:5px 12px;border-radius:99px;font-weight:800;font-size:14px}
.chip small{opacity:.75;font-weight:700}
.ex{background:var(--bg);border-left:5px solid var(--pri);border-radius:14px;padding:12px 14px}
.ex mark{background:var(--soft);color:var(--pri);padding:0 4px;border-radius:6px;font-weight:800}
.ex small{display:block;color:var(--mut);font-weight:700}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:20px;flex-wrap:wrap}
.bar{height:10px;background:var(--soft);border-radius:9px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.qtype{color:var(--mut);font-weight:800;font-size:14px}
.q{font-family:'Fredoka',sans-serif;font-size:22px;margin:6px 0 14px}
.big{font-size:90px;text-align:center;margin:6px 0 14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:13px;border-radius:16px;border:2px solid var(--line);background:var(--bg);font-weight:800;font-size:16px}
.opt:hover:not(:disabled){border-color:var(--pri);background:var(--soft)}
.opt.ok{background:var(--ok);color:var(--pri-ink);border-color:var(--ok)}
.opt.bad{background:var(--pink-soft);color:var(--bad);border-color:var(--bad)}
input[type=text]{width:100%;padding:13px 16px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:800 18px 'Nunito',sans-serif;margin-bottom:10px}
.fb{margin-top:14px;padding:12px 14px;border-radius:14px;font-weight:700}
.fb.ok{background:var(--soft);color:var(--pri)}.fb.bad{background:var(--pink-soft);color:var(--bad)}
.end{text-align:center;padding:20px 0}.end .big{font-size:72px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.list{flex-direction:row;overflow-x:auto}.item{flex:0 0 auto}.top{grid-template-columns:110px 1fr}.pic{font-size:58px;border-radius:24px}.word{font-size:30px}.opts{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== Giao diện tươi sáng + flashcard ===== */
body{background-color:var(--bg);background-image:var(--bgimg);background-attachment:fixed}
header{border:0;border-top:6px solid var(--pink);box-shadow:0 8px 24px rgba(76,110,245,.14)}
.logo{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:27px}
.stat{background:var(--grad2);color:#fff}
.pill.on,.tab.on,.btn.solid{background:var(--grad);color:var(--pri-ink);border-color:transparent}
.tab{transition:.15s}.tab:hover{transform:translateY(-2px)}
.card,.list{box-shadow:0 12px 30px rgba(76,110,245,.12)}
.item.on{background:linear-gradient(135deg,var(--soft),var(--pink-soft))}
.item.known b{opacity:.55}
.btn:hover{transform:translateY(-2px)}
.btn.bad{background:var(--pink-soft);color:var(--bad)}.btn.bad:hover{background:var(--bad);color:#fff}
.btn.ok{background:var(--ok);color:var(--pri-ink)}
.chip:nth-child(3n+2){background:var(--pink-soft);color:var(--bad)}
.chip:nth-child(3n){background:var(--soft);color:var(--pri)}
.def{background:var(--sun);color:var(--sun-ink);border-radius:14px;padding:8px 12px;font-weight:700;margin-bottom:10px;font-size:15px}
.q.def{font-family:'Nunito',sans-serif;font-weight:800;font-size:19px}
.fc{perspective:900px;cursor:pointer;margin:6px 0}
.fci{position:relative;height:350px;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fci{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:auto}
.front{background:var(--grad);color:var(--pri-ink)}
.front .word,.front .ipa{color:var(--pri-ink)}.front .word{font-size:48px}
.back{background:var(--card);border:3px solid var(--pri);transform:rotateY(180deg)}
.back .ex{text-align:left;width:100%}
.big.sm{font-size:52px;margin:0}
</style>
</head>

<script>
/* ============================================================
   ✏️ KHU VỰC NHẬP NỘI DUNG CHÍNH: DANH SÁCH CHỦ ĐỀ VÀ TỪ VỰNG
   Cấu trúc: T = [ chủ đề 1, chủ đề 2, ... ]
   Mỗi chủ đề = { name:'Tên', icon:'emoji', words:[ từ 1, từ 2, ... ] }
   Mỗi từ có các trường:
     w   = từ tiếng Anh
     d   = định nghĩa ngắn bằng tiếng Anh (không bắt buộc, có thì hiện thêm)
     p   = phiên âm
     pos = loại từ (n, v, adj...)
     vi  = nghĩa tiếng Việt
     e   = emoji làm hình minh họa
     c   = collocations: [['cụm tiếng Anh','nghĩa Việt'], ...]
     r   = từ liên quan: [['từ','nghĩa Việt'], ...]
     x   = câu ví dụ (PHẢI chứa đúng từ ở trường w)
     xv  = nghĩa câu ví dụ
   ============================================================ */
const T=[
  {name:'Reading IELTS',icon:'📚',words:[

{w:'benign',d:'harmless and not likely to cause damage',p:'/bɪˈnaɪn/',pos:'adj',vi:'lành tính, không gây hại',e:'🌿',c:[['benign condition','tình trạng lành tính'],['benign tumour','khối u lành tính'],['benign influence','ảnh hưởng tích cực']],r:[['harmless','vô hại'],['mild','nhẹ'],['safe','an toàn']],x:'Most skin growths are benign and do not require treatment.',xv:'Hầu hết các khối u da là lành tính và không cần điều trị.'},

{w:'fickle',d:'likely to change suddenly and unexpectedly',p:'/ˈfɪkəl/',pos:'adj',vi:'hay thay đổi, thất thường',e:'🎭',c:[['fickle market','thị trường thất thường'],['fickle customer','khách hàng hay thay đổi'],['fickle public opinion','dư luận thất thường']],r:[['unpredictable','khó đoán'],['changeable','dễ thay đổi'],['volatile','biến động']],x:'Consumer preferences can be surprisingly fickle.',xv:'Sở thích của người tiêu dùng có thể thay đổi rất thất thường.'},

{w:'idiosyncrasy',d:'a unique or unusual characteristic of a person or group',p:'/ˌɪdiəˈsɪŋkrəsi/',pos:'n',vi:'đặc tính riêng biệt, nét độc đáo',e:'🎨',c:[['cultural idiosyncrasy','nét đặc trưng văn hóa'],['personal idiosyncrasy','đặc điểm riêng cá nhân'],['national idiosyncrasy','đặc tính riêng của quốc gia']],r:[['trait','đặc điểm'],['peculiarity','nét khác thường'],['quirk','thói quen kỳ lạ']],x:'Every culture has its own idiosyncrasies.',xv:'Mỗi nền văn hóa đều có những nét riêng độc đáo của mình.'},

{w:'mundane',d:'ordinary and not interesting',p:'/mʌnˈdeɪn/',pos:'adj',vi:'tầm thường, thế tục',e:'📦',c:[['mundane task','công việc nhàm chán'],['mundane routine','thói quen thường ngày'],['mundane activity','hoạt động bình thường']],r:[['ordinary','bình thường'],['common','phổ biến'],['routine','thường nhật']],x:'The job involved many mundane tasks.',xv:'Công việc này bao gồm nhiều nhiệm vụ khá tẻ nhạt.'},

{w:'ambiguous',d:'having more than one possible meaning',p:'/æmˈbɪɡjuəs/',pos:'adj',vi:'mơ hồ, không rõ ràng',e:'❓',c:[['ambiguous statement','phát biểu mơ hồ'],['ambiguous language','ngôn ngữ không rõ ràng'],['ambiguous result','kết quả khó hiểu']],r:[['unclear','không rõ ràng'],['vague','mơ hồ'],['confusing','gây nhầm lẫn']],x:'The instructions were ambiguous and difficult to follow.',xv:'Các hướng dẫn mơ hồ và khó làm theo.'},

{w:'authoritarian',d:'demanding complete obedience and limiting freedom',p:'/əˌθɒrɪˈteəriən/',pos:'adj',vi:'độc đoán, độc tài',e:'👑',c:[['authoritarian regime','chế độ độc tài'],['authoritarian leader','nhà lãnh đạo độc đoán'],['authoritarian control','sự kiểm soát độc đoán']],r:[['dictatorial','độc tài'],['oppressive','áp bức'],['strict','hà khắc']],x:'The country was ruled by an authoritarian government.',xv:'Đất nước được cai trị bởi một chính quyền độc tài.'},

{w:'indifference',d:'lack of interest, concern or sympathy',p:'/ɪnˈdɪfərəns/',pos:'n',vi:'sự thờ ơ, vô cảm',e:'😐',c:[['public indifference','sự thờ ơ của công chúng'],['show indifference','thể hiện sự thờ ơ'],['attitude of indifference','thái độ thờ ơ']],r:[['apathy','sự lãnh đạm'],['disinterest','thiếu quan tâm'],['detachment','sự tách biệt']],x:'Public indifference made the campaign unsuccessful.',xv:'Sự thờ ơ của công chúng khiến chiến dịch không thành công.'},

{w:'alienate',d:'to make someone feel isolated or excluded',p:'/ˈeɪliəneɪt/',pos:'v',vi:'làm xa lánh, cô lập',e:'🚶',c:[['alienate voters','làm mất lòng cử tri'],['feel alienated','cảm thấy bị xa lánh'],['alienate customers','làm mất khách hàng']],r:[['isolate','cô lập'],['exclude','loại trừ'],['distance','tách xa']],x:'Harsh policies may alienate local communities.',xv:'Các chính sách cứng rắn có thể khiến cộng đồng địa phương xa lánh.'},

    {w:'pre-historian',d:'a scientist who studies prehistoric times and ancient human societies',p:'/ˌpriːhɪˈstɔːriən/',pos:'n',vi:'nhà tiền sử học',e:'🦴',c:[['prehistoric research','nghiên cứu tiền sử'],['study prehistory','nghiên cứu thời tiền sử'],['human evolution','tiến hóa loài người']],r:[['archaeologist','nhà khảo cổ học'],['anthropologist','nhà nhân chủng học'],['historian','nhà sử học']],x:'The pre-historian examined ancient stone tools.',xv:'Nhà tiền sử học nghiên cứu các công cụ đá cổ.'},

{w:'dispersal',d:'the process of spreading people, animals, or plants over a wide area',p:'/dɪˈspɜːsəl/',pos:'n',vi:'sự phân tán, lan rộng',e:'🌎',c:[['population dispersal','sự phân tán dân cư'],['species dispersal','sự phát tán loài'],['human dispersal','sự lan rộng của con người']],r:[['migration','di cư'],['expansion','mở rộng'],['distribution','phân bố']],x:'Scientists study the dispersal of early humans across continents.',xv:'Các nhà khoa học nghiên cứu sự lan rộng của người cổ đại trên các châu lục.'},

{w:'migration',d:'the movement of people or animals from one place to another',p:'/maɪˈɡreɪʃən/',pos:'n',vi:'sự di cư',e:'🚶',c:[['human migration','sự di cư của con người'],['mass migration','di cư hàng loạt'],['migration route','tuyến di cư']],r:[['movement','sự di chuyển'],['relocation','tái định cư'],['dispersal','sự phân tán']],x:'Climate change has influenced human migration for centuries.',xv:'Biến đổi khí hậu đã ảnh hưởng đến sự di cư của con người trong nhiều thế kỷ.'},

{w:'archaeological site',d:'a place where evidence of past human activity is found',p:'/ˌɑːkiəˈlɒdʒɪkəl saɪt/',pos:'n',vi:'di chỉ khảo cổ',e:'🏺',c:[['excavate a site','khai quật di chỉ'],['archaeological evidence','bằng chứng khảo cổ'],['historic site','địa điểm lịch sử']],r:[['ruins','tàn tích'],['artefact','cổ vật'],['excavation','khai quật']],x:'The archaeological site revealed evidence of ancient settlements.',xv:'Di chỉ khảo cổ đã tiết lộ dấu vết của các khu định cư cổ.'},

{w:'glacial stream',d:'a stream formed by melting glacier ice',p:'/ˈɡleɪʃəl striːm/',pos:'n',vi:'dòng sông băng',e:'🧊',c:[['glacial water','nước băng tan'],['mountain stream','suối vùng núi'],['glacial valley','thung lũng băng hà']],r:[['glacier','sông băng'],['ice sheet','dải băng'],['river','dòng sông']],x:'The glacial stream provided fresh water for early settlers.',xv:'Dòng nước băng tan cung cấp nước ngọt cho những cư dân đầu tiên.'},

{w:'anthropologist',d:'a scientist who studies humans, societies and cultures',p:'/ˌænθrəˈpɒlədʒɪst/',pos:'n',vi:'nhà nhân chủng học',e:'👨‍🔬',c:[['cultural anthropologist','nhà nhân chủng học văn hóa'],['field research','nghiên cứu thực địa'],['human societies','xã hội loài người']],r:[['archaeologist','nhà khảo cổ học'],['researcher','nhà nghiên cứu'],['historian','nhà sử học']],x:'The anthropologist studied ancient migration patterns.',xv:'Nhà nhân chủng học nghiên cứu các hình thức di cư cổ đại.'},

{w:'cutoff score',d:'the minimum score needed to qualify',p:'/ˈkʌtɒf skɔːr/',pos:'n',vi:'điểm chuẩn',e:'📏',c:[['meet the cutoff score','đạt điểm chuẩn'],['cutoff score rises','điểm chuẩn tăng'],['national cutoff score','điểm chuẩn quốc gia']],r:[['requirement','yêu cầu'],['benchmark','mốc điểm'],['qualification','điều kiện']],x:'The cutoff score was higher than expected this year.',xv:'Điểm chuẩn năm nay cao hơn dự kiến.'},

{w:'scholarship threshold',d:'the minimum score required for a scholarship',p:'/ˈskɒlərʃɪp ˈθreʃhoʊld/',pos:'n',vi:'mốc điểm học bổng',e:'🎓',c:[['reach the scholarship threshold','đạt mốc học bổng'],['scholarship requirement','điều kiện học bổng'],['academic scholarship','học bổng học tập']],r:[['cutoff score','điểm chuẩn'],['achievement','thành tích'],['award','phần thưởng']],x:'She exceeded the scholarship threshold by two points.',xv:'Cô ấy vượt ngưỡng học bổng hai điểm.'},

{w:'performance gap',d:'the difference between expected and actual performance',p:'/pərˈfɔːrməns ɡæp/',pos:'n',vi:'khoảng cách giữa kỳ vọng và kết quả',e:'📉',c:[['performance gap','khoảng cách thành tích'],['close the performance gap','thu hẹp khoảng cách'],['unexpected performance gap','khoảng cách ngoài dự đoán']],r:[['expectation','kỳ vọng'],['result','kết quả'],['achievement','thành tích']],x:'The performance gap surprised both students and teachers.',xv:'Khoảng cách giữa kỳ vọng và kết quả khiến cả học sinh lẫn giáo viên bất ngờ.'},

{w:'bounce back',d:'to recover quickly from a disappointing result',p:'/baʊns bæk/',pos:'v',vi:'vực dậy sau thất bại',e:'🌱',c:[['bounce back from failure','vực dậy sau thất bại'],['bounce back stronger','trở lại mạnh mẽ hơn'],['quickly bounce back','hồi phục nhanh']],r:[['recover','phục hồi'],['improve','cải thiện'],['persevere','kiên trì']],x:'She bounced back after failing her first attempt.',xv:'Cô ấy đã vực dậy sau lần thi trượt đầu tiên.'}

]}




];

/* ============================================================
   PHẦN XỬ LÝ (thường không cần sửa)
   ============================================================ */
const ALL=[];T.forEach((t,i)=>t.words.forEach(w=>{w.t=i;ALL.push(w)}));
const load=k=>{try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return{}}};
let P=load('mintyvocab'),K=load('mintyvocab_known'); /* K = các từ bạn đã đánh dấu "đã biết" */
const save=()=>{try{localStorage.setItem('mintyvocab',JSON.stringify(P));localStorage.setItem('mintyvocab_known',JSON.stringify(K))}catch(e){}};
const lv=w=>P[w.w]||0,isK=w=>!!K[w.w];
/* ✏️ MAX = mức nhớ tối đa; MASTER = mức để tính là "đã thuộc" */
const MAX=5,MASTER=3;
let S={t:0,i:0,tab:'learn',q:null,f:null,all:false};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const wre=w=>new RegExp('\\b'+w.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\w*','i');
const mt=w=>(w.x.match(wre(w))||[])[0];
const bump=(w,n)=>{P[w.w]=Math.max(0,Math.min(MAX,lv(w)+n))};
const hl=w=>w.x.replace(wre(w),m=>`<mark>${m}</mark>`);

function say(text,slow){
  try{
    const s=window.speechSynthesis;s.cancel();
    const u=new SpeechSynthesisUtterance(text);
    /* ✏️ GIỌNG ĐỌC: 'en-US' = Anh-Mỹ, đổi thành 'en-GB' để đọc giọng Anh-Anh; 0.9 = tốc độ thường, 0.55 = tốc độ chậm */
    u.lang='en-US';u.rate=slow?0.55:0.9;
    const v=s.getVoices().find(v=>/en[-_]US/i.test(v.lang));if(v)u.voice=v;
    s.speak(u);
  }catch(e){}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-say]');
  if(b)say(b.dataset.say,b.dataset.slow==='1');
});

function setTopic(i){S.t=i;S.i=0;S.q=null;S.f=null;S.all=false;if(S.tab==='practice')startQ();if(S.tab==='flash')startF();render()}
function setTab(t){S.tab=t;if(t==='practice')startQ();if(t==='flash')startF();render()}
function pick(i){S.i=i;render()}
/* ✅ ĐÃ SỬA LỖI: nút Từ trước/Từ sau trước đây gọi biến cục bộ nên không bấm được */
function step(n){const l=T[S.t].words.length;S.i=(S.i+n+l)%l;render()}
function mark(i){const w=T[S.t].words[i];if(isK(w))delete K[w.w];else K[w.w]=1;save();render()}

function header(){
  $('pills').innerHTML=T.map((t,i)=>`<button class="pill ${i===S.t?'on':''}" onclick="setTopic(${i})">${t.icon} ${t.name}</button>`).join('');
  const m=ALL.filter(w=>isK(w)||lv(w)>=MASTER).length;
  $('stat').textContent=`🌱 Đã thuộc ${m}/${ALL.length} từ`;
  [['learn','t-learn'],['flash','t-flash'],['practice','t-prac']].forEach(([k,id])=>$(id).classList.toggle('on',S.tab===k));
}

function learn(){
  const ws=T[S.t].words,w=ws[S.i],k=isK(w);
  const list=ws.map((x,i)=>`<button class="item ${i===S.i?'on':''} ${isK(x)?'known':''}" onclick="pick(${i})"><span class="em">${x.e}</span><span><b>${x.w}${isK(x)?' ✅':''}</b><span class="dots">${[1,2,3,4,5].map(n=>`<i class="${lv(x)>=n?'f':''}"></i>`).join('')}</span></span></button>`).join('');
  /* ✏️ ĐỔI TIÊU ĐỀ CÁC MỤC và tên nút ngay trong đoạn HTML bên dưới */
  $('main').innerHTML=`<div class="grid"><div class="list">${list}</div>
  <div class="card">
    <div class="top"><div class="pic" aria-hidden="true">${w.e}</div>
    <div><div class="word">${w.w}<span class="pos">${w.pos}</span></div><div class="ipa">${w.p}</div><div class="vi">${w.vi}</div>
    ${w.d?`<div class="def">📘 ${w.d}</div>`:''}
    <div class="row"><button class="btn solid" data-say="${esc(w.w)}">🔊 Nghe</button><button class="btn" data-say="${esc(w.w)}" data-slow="1">🐢 Nghe chậm</button><button class="btn ${k?'ok':''}" onclick="mark(${S.i})">${k?'✅ Đã biết (bấm để học lại)':'✔️ Mình đã biết từ này'}</button></div></div></div>
    <h3>🔗 Collocations (cụm từ hay đi cùng)</h3>
    <div class="cols">${w.c.map(c=>`<button class="col" data-say="${esc(c[0])}"><b>${c[0]}</b><small>${c[1]}</small></button>`).join('')}</div>
    <h3>🌼 Từ liên quan</h3>
    <div class="row">${w.r.map(r=>`<button class="chip" data-say="${esc(r[0])}">${r[0]} <small>· ${r[1]}</small></button>`).join('')}</div>
    <h3>💬 Ví dụ</h3>
    <div class="ex">${hl(w)}<small>${w.xv}</small><div class="row" style="margin-top:8px"><button class="btn" data-say="${esc(w.x)}">🔊 Nghe câu</button></div></div>
    <div class="nav"><button class="btn" onclick="step(-1)">← Từ trước</button>
    <button class="btn solid" onclick="setTab('flash')">🃏 Ôn bằng flashcard</button>
    <button class="btn" onclick="step(1)">Từ sau →</button></div>
  </div></div>`;
}

/* ===== FLASHCARD: lật thẻ, tự đánh giá; từ đã biết sẽ bị bỏ qua ===== */
function startF(){const ws=T[S.t].words.filter(w=>S.all||!isK(w));S.f={q:shuffle(ws),n:ws.length}}
function fnext(a){
  const f=S.f,w=f.q[0];
  if(a==='again')f.q.push(f.q.shift());
  else{f.q.shift();if(a==='ok')bump(w,1);else K[w.w]=1}
  save();render();
}
function flash(){
  const f=S.f;
  if(!f.q.length){
    $('main').innerHTML=`<div class="card end"><div class="big">${f.n?'🎉':'✅'}</div><div class="q">${f.n?'Bạn đã xem hết thẻ rồi!':'Mọi từ trong chủ đề này đều đã biết'}</div><div class="nav" style="justify-content:center"><button class="btn solid" onclick="S.all=true;startF();render()">🔁 Ôn lại cả từ đã biết</button><button class="btn" onclick="setTab('practice')">🎯 Luyện tập</button></div></div>`;
    return;
  }
  const w=f.q[0];
  $('main').innerHTML=`<div class="card"><div class="bar"><i style="width:${(f.n-f.q.length)/f.n*100}%"></i></div>
  <div class="qtype">Còn ${f.q.length} thẻ · bấm vào thẻ để lật</div>
  <div class="fc" onclick="this.classList.toggle('flip')"><div class="fci">
    <div class="face front"><div class="word">${w.w}</div><div class="ipa">${w.p}</div><span class="pos">${w.pos}</span></div>
    <div class="face back"><div class="big sm">${w.e}</div><div class="vi">${w.vi}</div>${w.d?`<div class="def">📘 ${w.d}</div>`:''}<div class="ex">${hl(w)}</div></div>
  </div></div>
  <div class="row" style="justify-content:center;margin:14px 0"><button class="btn" data-say="${esc(w.w)}">🔊 Nghe</button></div>
  <div class="nav" style="justify-content:center"><button class="btn bad" onclick="fnext('again')">😅 Chưa nhớ</button><button class="btn solid" onclick="fnext('ok')">🙂 Nhớ rồi</button><button class="btn ok" onclick="fnext('known')">✅ Đã biết – bỏ qua</button></div></div>`;
}

/* ===== LUYỆN TẬP GHI NHỚ LÂU ===== */
function startQ(){
  const ws=T[S.t].words.filter(w=>S.all||!isK(w));
  if(!ws.length){S.q={empty:1};return}
  /* ✏️ DẠNG BÀI: def = đọc định nghĩa chọn từ · blank = chọn từ điền câu · tblank = gõ từ điền câu · v2e = nhìn nghĩa gõ từ Anh · colloc = chọn cụm từ đúng · listen = nghe và gõ.
     Mỗi từ được hỏi 3 dạng ngẫu nhiên; câu làm sai sẽ được hỏi lại ở cuối bài (lặp lại ngắt quãng giúp nhớ lâu). */
  const qs=[];
  ws.forEach(w=>{
    const ts=['v2e','listen'];
    if(w.d)ts.push('def');if(mt(w))ts.push('blank','tblank');if(w.c&&w.c.length)ts.push('colloc');
    shuffle(ts).slice(0,3).forEach(t=>qs.push({w,t}));
  });
  S.q={list:shuffle(qs),i:0,score:0,n:qs.length,miss:[]};
}
function prep(c){
  if(c.ready)return;c.ready=1;
  const w=c.w;c.a=w.w;
  if(c.t==='def'||c.t==='blank')c.o=shuffle([w,...shuffle(ALL.filter(x=>x!==w)).slice(0,3)]).map(x=>x.w);
  if(c.t==='colloc'){
    const k=w.c[Math.floor(Math.random()*w.c.length)];c.k=k;c.a=k[0];
    const pool=ALL.filter(x=>x!==w&&x.c).flatMap(x=>x.c.map(y=>y[0]));
    c.o=shuffle([k[0],...shuffle(pool).slice(0,3)]);
  }
  if(c.t==='tblank')c.m=mt(w);
}
function practice(){
  const q=S.q;
  if(q.empty){
    $('main').innerHTML=`<div class="card end"><div class="big">✅</div><div class="q">Mọi từ trong chủ đề này đều đã biết</div><div class="nav" style="justify-content:center"><button class="btn solid" onclick="S.all=true;startQ();render()">🔁 Luyện cả từ đã biết</button><button class="btn" onclick="setTab('learn')">Về học từ</button></div></div>`;
    return;
  }
  if(q.i>=q.list.length){
    const pct=Math.round(q.score/q.n*100);
    /* ✏️ LỜI KHEN / NHẮC NHỞ KHI KẾT THÚC BÀI */
    $('main').innerHTML=`<div class="card end"><div class="big">${pct>=80?'🎉':pct>=50?'🌿':'🌱'}</div><div class="q">Bạn đúng ${q.score}/${q.n} câu ngay lần đầu</div><p class="ipa">${pct>=80?'Tuyệt vời! Từ vựng đang vào đầu rất tốt.':'Làm lại một lượt nữa để nhớ lâu hơn nhé.'}</p>${q.miss.length?`<h3>Từ cần ôn thêm</h3><div class="row" style="justify-content:center">${q.miss.map(w=>`<span class="chip">${w.w} <small>· ${w.vi}</small></span>`).join('')}</div>`:''}<div class="nav" style="justify-content:center"><button class="btn solid" onclick="startQ();render()">Làm lại</button><button class="btn" onclick="setTab('flash')">🃏 Flashcard</button><button class="btn" onclick="setTab('learn')">Về học từ</button></div></div>`;
    return;
  }
  const c=q.list[q.i],w=c.w;prep(c);
  const hint=w.w.split('').map((ch,i)=>i===0||ch===' '?ch:'_').join(' ');
  const opts=`<div class="opts">${(c.o||[]).map((o,i)=>`<button class="opt" onclick="ans(${i})">${o}</button>`).join('')}</div>`;
  const inp=`<input type="text" id="typed" placeholder="Gõ đáp án…" autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==='Enter')ansType()"><button class="btn solid" onclick="ansType()">Kiểm tra</button>`;
  const blank=w.x.replace(wre(w),'_____');
  const T2={
    def:()=>`<div class="qtype">Đọc định nghĩa, chọn từ đúng</div><div class="q def">“${w.d}”</div>${opts}`,
    blank:()=>`<div class="qtype">Chọn từ điền vào chỗ trống</div><div class="q">${blank}</div><p class="ipa" style="margin-bottom:12px">${w.xv}</p>${opts}`,
    tblank:()=>`<div class="qtype">Gõ từ còn thiếu</div><div class="q">${blank}</div><p class="ipa">${w.xv}</p><p class="ipa" style="margin-bottom:12px">Gợi ý: ${hint}</p>${inp}`,
    v2e:()=>`<div class="qtype">Nhìn nghĩa, gõ từ tiếng Anh</div><div class="q">${w.vi} <span class="pos">${w.pos}</span></div><p class="ipa" style="margin-bottom:12px">Gợi ý: ${hint}</p>${inp}`,
    colloc:()=>`<div class="qtype">Cụm từ nào có nghĩa là…</div><div class="q">“${c.k[1]}”</div>${opts}`,
    listen:()=>`<div class="qtype">Nghe và gõ lại từ</div><div class="big"><button class="btn solid" style="font-size:34px;padding:14px 28px" data-say="${esc(w.w)}">🔊</button></div>${inp}`
  };
  $('main').innerHTML=`<div class="card"><div class="bar"><i style="width:${q.i/q.list.length*100}%"></i></div>${c.retry?'<span class="pos">ôn lại 🔁</span>':''}${T2[c.t]()}<div id="fb"></div></div>`;
  if(c.t==='listen'){setTimeout(()=>{say(w.w);const t=$('typed');if(t)t.focus()},250)}
  else if(c.t==='tblank'||c.t==='v2e'){const t=$('typed');if(t)t.focus()}
}
function result(ok,c){
  const q=S.q;if(c.done)return;c.done=true;
  if(ok&&!c.retry)q.score++;
  bump(c.w,ok?1:-1);save();header();
  if(!ok){
    if(!q.miss.includes(c.w))q.miss.push(c.w);
    if(!c.retry)q.list.push({w:c.w,t:c.t==='v2e'?'listen':'v2e',retry:1});
  }
  const w=c.w;
  /* ✏️ LỜI PHẢN HỒI KHI TRẢ LỜI ĐÚNG / SAI */
  $('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}">${ok?'Chính xác! 🎉':'Chưa đúng, đáp án là: <b>'+c.a+'</b>'} – <b>${w.w}</b>: ${w.vi}${w.d?'<br><small>📘 '+w.d+'</small>':''}${ok?'':'<br><small>🔁 Từ này sẽ quay lại cuối bài để bạn ôn lại.</small>'}</div><div class="nav"><button class="btn" data-say="${esc(w.x)}">🔊 Nghe ví dụ</button><button class="btn solid" onclick="S.q.i++;render()">Câu tiếp →</button></div>`;
}
function ans(i){
  const c=S.q.list[S.q.i];if(c.done)return;
  const ok=c.o[i]===c.a;
  document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(c.o[j]===c.a)b.classList.add('ok');else if(j===i)b.classList.add('bad')});
  result(ok,c);
}
function ansType(){
  const c=S.q.list[S.q.i];if(c.done)return;
  const v=$('typed').value.trim().toLowerCase();if(!v)return;
  $('typed').disabled=true;
  result(v===c.a.toLowerCase()||(!!c.m&&v===c.m.toLowerCase()),c);
}

function render(){header();({learn,flash,practice})[S.tab]()}
if(window.speechSynthesis)speechSynthesis.getVoices();
render();
</script>
</body>
</html>
